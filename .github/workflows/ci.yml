name: ci

on: [push, pull_request]

jobs:
  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
      - run: |
          mkdir -p build
          ghc -Wall -outputdir build -o build/main Main.hs
          build/main | tee out.txt
          test "$(cat out.txt)" = "$(printf '[6857,6857,6857,6857,6857,6857]\n[1074,1074,1074,1074,1074,1074]')"

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: java
        run: |
          javac -d build *.java
          test "$(java -cp build Problem3)" = 6857
          test "$(java -cp build Problem18)" = 1074
